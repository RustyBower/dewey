<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Book spine -->
  <rect x="6" y="4" width="6" height="40" rx="2" fill="#e11d48"/>
  <!-- Book cover -->
  <rect x="10" y="4" width="28" height="40" rx="2" fill="#f43f5e"/>
  <!-- Book pages (lighter edge) -->
